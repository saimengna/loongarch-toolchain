name: Build reusable

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Artifact name suffix"
        type: string
        default: ""
      os:
        description: "Runner OS list"
        type: string
        default: '["ubuntu-22.04","ubuntu-24.04"]'
      mode:
        description: "Library mode list"
        type: string
        default: '["newlib","linux","musl"]'
      target:
        description: "Target list"
        type: string
        default: '["loongarch64-lp64d"]'
      compiler:
        description: "Compiler list"
        type: string
        default: '["gcc","llvm"]'
      cmodel:
        description: "Code model list"
        type: string
        default: '[""]'
      languages:
        description: "GCC language list"
        type: string
        default: '[""]'
      strip:
        description: "unstripped, stripped, or both"
        type: string
        default: unstripped
      report:
        description: "Run tests and print reports"
        type: boolean
        default: true
      regression-suite:
        description: "Run Tier 2 regression suite: p0 or empty"
        type: string
        default: ""
      package-artifacts:
        description: "Create toolchain archives"
        type: boolean
        default: true
      upload-artifacts:
        description: "Upload toolchain archives"
        type: boolean
        default: true
      gdb:
        description: "Build GDB"
        type: boolean
        default: true
      build-sim:
        description: "Build the QEMU user-mode simulator"
        type: boolean
        default: false
      use-prebuilt-gnu:
        description: "Build LLVM only, using the GNU artifact"
        type: boolean
        default: false
      builder-image-repository:
        description: "Optional GHCR repository for the glibc-2.28 build image"
        type: string
        default: ""
      builder-image-tag:
        description: "Builder image tag prefix"
        type: string
        default: "glibc228"
      host-glibc-max:
        description: "Highest host glibc symbol version allowed"
        type: string
        default: "2.28"
      target-glibc-max:
        description: "Highest target glibc symbol version allowed"
        type: string
        default: "2.36"
env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_DIR: /mnt/ccache
  CCACHE_MAXSIZE: 2G
  GIT_TERMINAL_PROMPT: '0'
  GIT_SSH_COMMAND: 'ssh -o BatchMode=yes -o ConnectTimeout=10'
  submodule_paths: |
    binutils
    gcc
    gdb
    glibc
    newlib
    musl
    qemu
    llvm
    .git/modules

jobs:
  report-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Report inputs
        run: |
          echo "artifact:  ${{ inputs.artifact-name }}"
          echo "os:        ${{ inputs.os }}"
          echo "mode:      ${{ inputs.mode }}"
          echo "target:    ${{ inputs.target }}"
          echo "compiler:  ${{ inputs.compiler }}"
          echo "cmodel:    ${{ inputs.cmodel }}"
          echo "languages: ${{ inputs.languages }}"
          echo "strip:     ${{ inputs.strip }}"
          echo "report:    ${{ inputs.report }}"
          echo "regression: ${{ inputs.regression-suite }}"
          echo "package:   ${{ inputs.package-artifacts }}"
          echo "upload:    ${{ inputs.upload-artifacts }}"
          echo "build-sim: ${{ inputs.build-sim }}"
          echo "builder:   ${{ inputs.builder-image-repository }}:${{ inputs.builder-image-tag }}"
          echo "host glibc max:   ${{ inputs.host-glibc-max }}"
          echo "target glibc max: ${{ inputs.target-glibc-max }}"

  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate strip
        run: |
          case '${{ inputs.strip }}' in
            unstripped|stripped|both) ;;
            *) echo "invalid strip value: ${{ inputs.strip }}"; exit 1 ;;
          esac

      - name: Validate prebuilt GNU request
        if: ${{ inputs.use-prebuilt-gnu }}
        run: |
          compiler="$(echo '${{ inputs.compiler }}' | tr -d '[]\" ')"
          if [[ "$compiler" != "llvm" ]]; then
            echo "use-prebuilt-gnu requires compiler [\"llvm\"]"
            exit 1
          fi
          if [[ '${{ inputs.strip }}' == 'stripped' ]]; then
            echo "use-prebuilt-gnu requires unstripped or both"
            exit 1
          fi

      - name: Validate builder image path
        if: ${{ inputs.builder-image-repository != '' }}
        shell: bash
        run: |
          set -euo pipefail
          compilers="$(echo '${{ inputs.compiler }}' | tr -d '[]\" ')"
          if [[ "$compilers" != "gcc" && "$compilers" != "llvm" ]]; then
            echo "builder-image path supports gcc or llvm only"
            exit 1
          fi
          if [[ "$compilers" == "llvm" && '${{ inputs.use-prebuilt-gnu }}' != true ]]; then
            echo "builder-image LLVM builds require use-prebuilt-gnu"
            exit 1
          fi
          if [[ '${{ inputs.gdb }}' == true || '${{ inputs.build-sim }}' == true || '${{ inputs.report }}' == true ]]; then
            echo "builder-image path does not support GDB, QEMU, or reports"
            exit 1
          fi

      - name: Validate Tier 2 regression request
        if: ${{ inputs.regression-suite != '' }}
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.regression-suite }}' in
            p0) ;;
            *) echo "unsupported regression suite: ${{ inputs.regression-suite }}"; exit 1 ;;
          esac
          modes="$(echo '${{ inputs.mode }}' | tr -d '[]\" ')"
          if [[ ",$modes," != *",linux,"* && ",$modes," != *",musl,"* ]]; then
            echo "Tier 2 P0 supports linux and musl modes only"
            exit 1
          fi
          compilers="$(echo '${{ inputs.compiler }}' | tr -d '[]\" ')"
          if [[ ",$compilers," != *",gcc,"* ]]; then
            echo "Tier 2 P0 currently supports GCC only"
            exit 1
          fi
          if [[ '${{ inputs.builder-image-repository }}' == '' && '${{ inputs.build-sim }}' != true ]]; then
            echo "Tier 2 regression on the host path requires build-sim: true"
            exit 1
          fi

  submodule-cache:
    needs: [validate-inputs]
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.keygen.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: sudo ./.github/cleanup-rootfs.sh

      - name: Generate cache key
        id: keygen
        run: |
          source_key="$(printf '%s\n' '${{ inputs.mode }}' '${{ inputs.compiler }}' '${{ inputs.gdb }}' '${{ inputs.build-sim }}' '${{ inputs.use-prebuilt-gnu }}' '${{ inputs.regression-suite }}' | sha1sum | cut -d' ' -f1)"
          rev_key="$(git rev-parse HEAD 2>/dev/null || git submodule 2>/dev/null | sha1sum | cut -d' ' -f1)"
          key="smcache-${source_key}-${rev_key}"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.submodule_paths }}
          key: ${{ steps.keygen.outputs.key }}

      - name: Fetch sources for requested matrix
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          modes='${{ inputs.mode }}'
          compilers='${{ inputs.compiler }}'

          if [[ '${{ inputs.use-prebuilt-gnu }}' == true ]]; then
            components=(binutils llvm)
          else
            components=(binutils gcc)
            if [[ "$modes" == *newlib* ]]; then components+=(newlib); fi
            if [[ "$modes" == *linux* ]]; then components+=(glibc); fi
            if [[ "$modes" == *musl* ]]; then components+=(musl); fi
            if [[ '${{ inputs.gdb }}' == true ]]; then components+=(gdb); fi
            if [[ "$compilers" == *llvm* ]]; then components+=(llvm); fi
          fi
          if [[ '${{ inputs.build-sim }}' == true ]]; then components+=(qemu); fi

          for component in "${components[@]}"; do
            if [[ ! -d "$component" || -z "$(ls -A "$component" 2>/dev/null | grep -v '^\.git$')" ]]; then
              bash scripts/fetch-sources.sh "$component"
            fi
          done

  build:
    needs: [submodule-cache, validate-inputs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        mode: ${{ fromJSON(inputs.mode) }}
        target: ${{ fromJSON(inputs.target) }}
        compiler: ${{ fromJSON(inputs.compiler) }}
        cmodel: ${{ fromJSON(inputs.cmodel) }}
        languages: ${{ fromJSON(inputs.languages) }}
        report:
          - ${{ inputs.report }}
        build-sim:
          - ${{ inputs.build-sim }}
    env:
      smcache_key: ${{ needs.submodule-cache.outputs.key }}
      SOURCE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate toolchain names
        id: names
        shell: bash
        run: |
          case '${{ matrix.mode }}' in
            linux)  label=glibc ;;
            musl)   label=musl ;;
            *)      label=elf ;;
          esac
          suffix='${{ inputs.artifact-name }}'
          [[ -n "$suffix" ]] && suffix="-$suffix"
          host_arch="$(uname -m)"
          host_glibc='${{ inputs.host-glibc-max }}'
          target_glibc='${{ inputs.target-glibc-max }}'
          host_tag="${host_glibc//./}"
          target_tag="${target_glibc//./}"
          image_arch=""
          case "$host_arch" in
            x86_64) image_arch=amd64 ;;
            aarch64) image_arch=arm64 ;;
            *) echo "unsupported host arch: $host_arch" >&2; exit 1 ;;
          esac
          if [[ -n '${{ inputs.builder-image-repository }}' ]]; then
            if [[ "$label" == glibc ]]; then
              gnu_base="loongarch64-${label}-${host_arch}-host-glibc${host_tag}-target-glibc${target_tag}"
            else
              gnu_base="loongarch64-${label}-${host_arch}-host-glibc${host_tag}"
            fi
            base="$gnu_base"
            [[ '${{ matrix.compiler }}' == llvm ]] && base="${base}-llvm"
            repo='${{ inputs.builder-image-repository }}'
            image="${repo,,}:${{ inputs.builder-image-tag }}-${image_arch}"
          else
            gnu_base="loongarch64-${label}-${{ matrix.os }}-gcc"
            base="loongarch64-${label}-${{ matrix.os }}-${{ matrix.compiler }}"
            image=""
          fi
          echo "unstripped=${base}${suffix}" >> "$GITHUB_OUTPUT"
          echo "stripped=${base}-stripped${suffix}" >> "$GITHUB_OUTPUT"
          echo "gnu=${gnu_base}${suffix}" >> "$GITHUB_OUTPUT"
          echo "builder-image=$image" >> "$GITHUB_OUTPUT"
          echo "host-arch=$host_arch" >> "$GITHUB_OUTPUT"

      - name: Free runner disk space
        run: sudo ./.github/cleanup-rootfs.sh

      - name: Configure swap
        shell: bash
        run: |
          if swapon --noheadings --show=NAME | grep -qx /swapfile; then
            sudo swapoff /swapfile
          fi
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        if: ${{ inputs.builder-image-repository == '' }}
        run: sudo ./.github/setup-apt.sh

      - name: Enable ccache
        if: ${{ inputs.builder-image-repository == '' }}
        run: echo '/usr/lib/ccache' >> "$GITHUB_PATH"

      - name: Prepare ccache
        if: ${{ inputs.builder-image-repository == '' }}
        run: |
          sudo mkdir -p "$CCACHE_DIR"
          sudo chown runner:runner "$CCACHE_DIR"

      - name: Restore ccache
        if: ${{ inputs.builder-image-repository == '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-v1-${{ matrix.os }}-

      - name: Restore component cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.submodule_paths }}
          key: ${{ env.smcache_key }}

      - name: Initialize ccache
        if: ${{ inputs.builder-image-repository == '' }}
        run: |
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z
          ccache -s

      - name: Ensure required sources
        shell: bash
        run: |
          case '${{ matrix.mode }}' in
            linux) libc=glibc ;;
            musl) libc=musl ;;
            *) libc=newlib ;;
          esac
          if [[ '${{ inputs.use-prebuilt-gnu }}' == true ]]; then
            components=(binutils llvm)
          else
            components=(binutils gcc "$libc")
            [[ '${{ inputs.gdb }}' == true ]] && components+=(gdb)
            [[ '${{ matrix.compiler }}' == llvm ]] && components+=(llvm)
          fi
          [[ '${{ matrix.build-sim }}' == true ]] && components+=(qemu)
          for component in "${components[@]}"; do
            if [[ ! -d "$component" || -z "$(ls -A "$component" 2>/dev/null | grep -v '^\.git$')" ]]; then
              bash scripts/fetch-sources.sh "$component"
            fi
          done

      - name: Download prebuilt GNU toolchain
        if: ${{ inputs.use-prebuilt-gnu }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.names.outputs.gnu }}
          path: prebuilt-gnu

      - name: Extract prebuilt GNU toolchain for container
        if: ${{ inputs.use-prebuilt-gnu && inputs.builder-image-repository != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prebuilt-root install-toolchain
          mkdir -p prebuilt-root
          tar xJf "prebuilt-gnu/${{ steps.names.outputs.gnu }}.tar.xz" -C prebuilt-root
          top="$(find prebuilt-root -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$top"
          mv "$top" install-toolchain
          rm -rf prebuilt-root prebuilt-gnu
          ls install-toolchain/bin/*-gcc >/dev/null

      - name: Log in to GHCR
        if: ${{ inputs.builder-image-repository != '' }}
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Pull builder image
        if: ${{ inputs.builder-image-repository != '' }}
        run: |
          set -euo pipefail
          image='${{ steps.names.outputs.builder-image }}'
          test -n "$image"
          docker pull "$image"

      - name: Install patchelf
        if: ${{ inputs.builder-image-repository != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v patchelf >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y patchelf
          fi
          patchelf --version

      - name: Build and package in glibc 2.28 container
        if: ${{ inputs.builder-image-repository != '' }}
        shell: bash
        run: |
          set -euo pipefail
          image='${{ steps.names.outputs.builder-image }}'
          prefix="$GITHUB_WORKSPACE/install-toolchain"
          test -n "$image"
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e USER=runner \
            -e LOGNAME=runner \
            -e GIT_TERMINAL_PROMPT=0 \
            -e BUILDER_IMAGE="$image" \
            -e CI_COMPILER='${{ matrix.compiler }}' \
            -e CI_PREBUILT_GNU='${{ inputs.use-prebuilt-gnu }}' \
            -e SOURCE_TAG="$SOURCE_TAG" \
            -e SOURCE_COMMIT="$SOURCE_COMMIT" \
            -e SOURCE_REPO="$SOURCE_REPO" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            "$image" \
            bash -lc "cd '$GITHUB_WORKSPACE' && bash scripts/ci-build-in-container.sh \
              --mode '${{ matrix.mode }}' \
              --target '${{ matrix.target }}' \
              --prefix '$prefix' \
              --outdir '$GITHUB_WORKSPACE' \
              --unstripped-name '${{ steps.names.outputs.unstripped }}' \
              --stripped-name '${{ steps.names.outputs.stripped }}' \
              --strip-mode '${{ inputs.strip }}' \
              --host-glibc-max '${{ inputs.host-glibc-max }}' \
              --target-glibc-max '${{ inputs.target-glibc-max }}' \
              --defer-package"

      - name: Finalize glibc 2.28 toolchain
        if: ${{ inputs.builder-image-repository != '' }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/install-toolchain"

          bash scripts/bundle-host-libs.sh --prefix "$prefix" --patch-only

          case '${{ matrix.mode }}' in
            linux) triple=loongarch64-unknown-linux-gnu ;;
            musl)  triple=loongarch64-unknown-linux-musl ;;
            *)     triple=loongarch64-unknown-elf ;;
          esac
          abi="$(echo '${{ matrix.target }}' | sed 's/^loongarch64-//')"

          if [[ '${{ matrix.compiler }}' == llvm ]]; then
            cc="$prefix/bin/${triple}-clang"
            cxx="$prefix/bin/${triple}-clang++"
          else
            cc="$prefix/bin/${triple}-gcc"
            cxx="$prefix/bin/${triple}-g++"
          fi
          test -x "$cc"
          env -u LD_LIBRARY_PATH "$cc" --version
          if [[ '${{ matrix.compiler }}' != llvm ]]; then
            env -u LD_LIBRARY_PATH "$cc" -dumpmachine | grep -qx "$triple"
          fi

          tmpdir="$(mktemp -d)"
          printf 'int smoke(void) { return 42; }\n' > "$tmpdir/smoke.c"
          printf 'int smoke_cpp(void) { return 42; }\n' > "$tmpdir/smoke.cpp"
          if [[ '${{ matrix.compiler }}' == llvm ]]; then
            env -u LD_LIBRARY_PATH "$cc" --target="$triple" -mabi="$abi" -c "$tmpdir/smoke.c" -o "$tmpdir/smoke.o"
          else
            env -u LD_LIBRARY_PATH "$cc" -c "$tmpdir/smoke.c" -o "$tmpdir/smoke.o"
          fi
          file "$tmpdir/smoke.o" | grep -qi loongarch

          if [[ -x "$cxx" ]]; then
            if [[ '${{ matrix.compiler }}' == llvm ]]; then
              env -u LD_LIBRARY_PATH "$cxx" --target="$triple" -mabi="$abi" -c "$tmpdir/smoke.cpp" -o "$tmpdir/smoke-cpp.o"
            else
              env -u LD_LIBRARY_PATH "$cxx" -c "$tmpdir/smoke.cpp" -o "$tmpdir/smoke-cpp.o"
            fi
            file "$tmpdir/smoke-cpp.o" | grep -qi loongarch
          fi

          for program in cc1 cc1plus lto1; do
            path="$(env -u LD_LIBRARY_PATH "$cc" -print-prog-name="$program" 2>/dev/null || true)"
            [[ -f "$path" ]] || continue
            if env -u LD_LIBRARY_PATH ldd "$path" 2>&1 | grep -q 'not found'; then
              echo "缺少动态库依赖: $path" >&2
              env -u LD_LIBRARY_PATH ldd "$path" >&2
              exit 1
            fi
          done
          rm -rf "$tmpdir"

      - name: Install Tier 2 test dependencies
        if: ${{ inputs.builder-image-repository != '' && inputs.regression-suite != '' && matrix.compiler == 'gcc' && matrix.mode != 'newlib' }}
        shell: bash
        run: |
          set -euo pipefail
          packages=()

          if ! command -v runtest >/dev/null 2>&1; then
            packages+=(dejagnu)
          fi

          # Debian/Ubuntu ship /usr/bin/qemu-loongarch64 in qemu-user, while
          # qemu-user-static only ships the -static suffixed binary.
          if ! command -v qemu-loongarch64 >/dev/null 2>&1; then
            if command -v qemu-loongarch64-static >/dev/null 2>&1; then
              qemu_bindir="$RUNNER_TEMP/qemu-bin"
              mkdir -p "$qemu_bindir"
              ln -sf "$(command -v qemu-loongarch64-static)" "$qemu_bindir/qemu-loongarch64"
              echo "$qemu_bindir" >> "$GITHUB_PATH"
              export PATH="$qemu_bindir:$PATH"
            else
              packages+=(qemu-user)
            fi
          fi

          if (( ${#packages[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
          command -v runtest
          command -v qemu-loongarch64
          runtest --version | head -n 1
          qemu-loongarch64 --version | head -n 1

      # The archive is built once, inside the glibc 2.28 container.  Tier 2
      # runs on that same build tree on the runner, using the distro QEMU
      # user-mode emulator, so what is tested is what gets packaged.
      - name: Run Tier 2 regression on the built toolchain
        if: ${{ inputs.builder-image-repository != '' && inputs.regression-suite != '' && matrix.compiler == 'gcc' && matrix.mode != 'newlib' }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/install-toolchain"

          # The compiler in the GCC build tree is linked against the container
          # libmpfr.so.4, which is bundled under $prefix/lib.  The installed
          # compiler does not need this because it carries an $ORIGIN RPATH.
          export LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          for exe in build-gcc-*-stage2/gcc/cc1 build-gcc-*-stage2/gcc/cc1plus; do
            [[ -f "$exe" ]] || continue
            if ldd "$exe" | grep -q 'not found'; then
              echo "缺少动态库依赖: $exe" >&2
              ldd "$exe" >&2
              exit 1
            fi
          done

          bash scripts/run-tier2-regression.sh \
            --mode '${{ matrix.mode }}' \
            --suite '${{ inputs.regression-suite }}' \
            --prefix "$prefix" \
            --report-dir "$GITHUB_WORKSPACE/tier2-results"

      - name: Package glibc 2.28 toolchain
        if: ${{ inputs.builder-image-repository != '' }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/install-toolchain"
          case '${{ inputs.strip }}' in
            unstripped|both)
              bash scripts/package-toolchain.sh \
                --prefix "$prefix" --mode '${{ matrix.mode }}' --outdir "$GITHUB_WORKSPACE" \
                --name '${{ steps.names.outputs.unstripped }}'
              ;;
          esac
          case '${{ inputs.strip }}' in
            stripped|both)
              bash scripts/package-toolchain.sh \
                --prefix "$prefix" --mode '${{ matrix.mode }}' --outdir "$GITHUB_WORKSPACE" \
                --name '${{ steps.names.outputs.stripped }}' --strip
              ;;
          esac

      - name: Configure
        if: ${{ inputs.builder-image-repository == '' }}
        shell: bash
        run: |
          tuple=($(echo '${{ matrix.target }}' | tr '-' '\n'))
          args=(--prefix=/mnt/loongarch --with-arch="${tuple[0]}" --with-abi="${tuple[1]}")
          case '${{ matrix.mode }}' in
            linux) args+=(--enable-linux) ;;
            musl)  args+=(--enable-musl) ;;
          esac
          [[ '${{ inputs.gdb }}' == true ]] || args+=(--disable-gdb)
          [[ '${{ matrix.compiler }}' == llvm ]] && args+=(--enable-llvm)
          [[ -n '${{ matrix.cmodel }}' ]] && args+=(--with-cmodel='${{ matrix.cmodel }}')
          [[ -n '${{ matrix.languages }}' ]] && args+=(--with-languages='${{ matrix.languages }}')
          ./configure "${args[@]}"
          sudo mkdir -p /mnt/loongarch
          sudo chown -R "$USER" /mnt/loongarch

      - name: Restore prebuilt GNU toolchain
        if: ${{ inputs.use-prebuilt-gnu && inputs.builder-image-repository == '' }}
        shell: bash
        run: |
          tar xJf "prebuilt-gnu/${{ steps.names.outputs.gnu }}.tar.xz" -C /mnt/
          rm -rf prebuilt-gnu
          ls /mnt/loongarch/bin/*-gcc >/dev/null

      - name: Build toolchain
        if: ${{ inputs.builder-image-repository == '' && !inputs.use-prebuilt-gnu }}
        run: make -j"$(nproc)" '${{ matrix.mode }}'

      - name: Verify built toolchain
        if: ${{ inputs.builder-image-repository == '' && matrix.compiler == 'gcc' }}
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.mode }}' in
            linux) triple=loongarch64-unknown-linux-gnu ;;
            musl)  triple=loongarch64-unknown-linux-musl ;;
            *)     triple=loongarch64-unknown-elf ;;
          esac
          cc="/mnt/loongarch/bin/${triple}-gcc"
          test -x "$cc"
          "$cc" --version
          "$cc" -dumpmachine | grep -qx "$triple"
          printf 'int smoke(void) { return 42; }\n' > /tmp/smoke.c
          "$cc" -c /tmp/smoke.c -o /tmp/smoke.o
          file /tmp/smoke.o | grep -qi loongarch

      - name: Build LLVM on prebuilt GNU toolchain
        if: ${{ inputs.builder-image-repository == '' && inputs.use-prebuilt-gnu }}
        run: |
          make -j"$(nproc)" \
            -o 'stamps/build-gcc-${{ matrix.mode }}-stage2' \
            'stamps/build-llvm-${{ matrix.mode }}'

      - name: Build QEMU
        if: ${{ inputs.builder-image-repository == '' && matrix.build-sim }}
        run: make -j"$(nproc)" build-sim

      - name: Run Tier 2 regression
        if: ${{ inputs.builder-image-repository == '' && inputs.regression-suite != '' }}
        shell: bash
        run: |
          bash scripts/run-tier2-regression.sh \
            --mode '${{ matrix.mode }}' \
            --suite '${{ inputs.regression-suite }}' \
            --prefix /mnt/loongarch \
            --report-dir "$GITHUB_WORKSPACE/tier2-results"

      - name: Run report
        if: |
          inputs.builder-image-repository == ''
          && matrix.os == 'ubuntu-24.04'
          && (matrix.mode == 'linux' || matrix.mode == 'newlib')
          && matrix.compiler == 'gcc'
          && matrix.report == true
          && inputs.regression-suite == ''
        run: make -j"$(nproc)" report-${{ matrix.mode }}

      - name: Upload Tier 2 reports
        if: ${{ always() && inputs.regression-suite != '' && matrix.compiler == 'gcc' && matrix.mode != 'newlib' }}
        uses: actions/upload-artifact@v4
        with:
          name: tier2-${{ matrix.os }}-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            tier2-results/**
            build-gcc-${{ matrix.mode }}-stage2/gcc/testsuite/**/*.sum
            build-binutils-linux/**/*.sum
          if-no-files-found: warn
          retention-days: 14

      - name: Show ccache statistics
        if: ${{ always() && inputs.builder-image-repository == '' }}
        run: ccache -s

      - name: Save ccache
        if: |
          always() && !cancelled() && github.event_name != 'pull_request'
          && inputs.builder-image-repository == ''
          && matrix.mode == 'linux' && matrix.compiler == 'gcc'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ matrix.os }}-${{ github.run_id }}

      - name: Record versions
        if: ${{ inputs.builder-image-repository == '' }}
        shell: bash
        run: |
          make versions
          cp versions.txt /mnt/loongarch/VERSIONS.txt

      - name: Remove build trees before packaging
        if: ${{ inputs.builder-image-repository == '' && inputs.package-artifacts }}
        run: rm -rf build-* stamps install-host-gcc install-newlib-nano

      - name: Package unstripped
        if: ${{ inputs.builder-image-repository == '' && inputs.package-artifacts && (inputs.strip == 'unstripped' || inputs.strip == 'both') }}
        run: |
          bash scripts/package-toolchain.sh \
            --prefix /mnt/loongarch \
            --mode '${{ matrix.mode }}' \
            --outdir . \
            --name '${{ steps.names.outputs.unstripped }}'

      - name: Package stripped
        if: ${{ inputs.builder-image-repository == '' && inputs.package-artifacts && (inputs.strip == 'stripped' || inputs.strip == 'both') }}
        run: |
          bash scripts/package-toolchain.sh \
            --prefix /mnt/loongarch \
            --mode '${{ matrix.mode }}' \
            --outdir . \
            --name '${{ steps.names.outputs.stripped }}' \
            --strip

      - name: Upload unstripped artifact
        if: ${{ inputs.upload-artifacts && (inputs.strip == 'unstripped' || inputs.strip == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.unstripped }}
          path: ${{ steps.names.outputs.unstripped }}.tar.xz
          compression-level: 0
          retention-days: 1

      - name: Upload stripped artifact
        if: ${{ inputs.upload-artifacts && (inputs.strip == 'stripped' || inputs.strip == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.stripped }}
          path: ${{ steps.names.outputs.stripped }}.tar.xz
          compression-level: 0
          retention-days: 1
