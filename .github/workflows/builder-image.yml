name: Build glibc 2.28 builder images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag prefix"
        required: true
        default: "glibc228"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            base_image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            base_image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/loongarch-builder:${{ inputs.tag }}-${{ matrix.arch }}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build builder image
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --build-arg BASE_IMAGE='${{ matrix.base_image }}' \
            --file .github/containers/glibc228/Dockerfile \
            --tag "$IMAGE" \
            .

      - name: Verify host glibc in image
        run: |
          set -euo pipefail
          actual="$(docker run --rm "$IMAGE" sh -c 'ldd --version | head -n 1')"
          echo "$actual"
          echo "$actual" | grep -Eq '2\.28([^0-9]|$)'

      - name: Verify LLVM build prerequisites
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" sh -c 'cmake --version | head -n 1'

      - name: Verify testsuite prerequisites
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" bash -c '
            set -euo pipefail
            runtest --version
            echo "puts tcl-ok" | tclsh
          '

      - name: Push builder image
        run: docker push "$IMAGE"
