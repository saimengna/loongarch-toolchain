name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: release
      os: '["ubuntu-24.04","ubuntu-24.04-arm"]'
      mode: '["newlib","linux","musl"]'
      target: '["loongarch64-lp64d"]'
      compiler: '["gcc"]'
      strip: unstripped
      report: false
      gdb: false
      build-sim: false
      builder-image-repository: ghcr.io/${{ github.repository_owner }}/loongarch-builder
      builder-image-tag: glibc228
      host-glibc-max: "2.28"
      target-glibc-max: "2.36"

  # LLVM gets its own job budget and consumes the matching GCC archive from
  # the build job.  It does not rebuild GCC or any target C library.
  build-llvm:
    needs: [build]
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: release
      os: '["ubuntu-24.04","ubuntu-24.04-arm"]'
      mode: '["newlib","linux","musl"]'
      target: '["loongarch64-lp64d"]'
      compiler: '["llvm"]'
      strip: unstripped
      report: false
      gdb: false
      build-sim: false
      use-prebuilt-gnu: true
      builder-image-repository: ghcr.io/${{ github.repository_owner }}/loongarch-builder
      builder-image-tag: glibc228
      host-glibc-max: "2.28"
      target-glibc-max: "2.36"

  verify:
    needs: [build, build-llvm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host_arch: x86_64
          - runner: ubuntu-24.04-arm
            host_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download ${{ matrix.host_arch }} artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'loongarch64-*-${{ matrix.host_arch }}-host-glibc228*'
          path: artifacts
          merge-multiple: true

      - name: Check ${{ matrix.host_arch }} artifact count
        shell: bash
        run: |
          set -euo pipefail
          count="$(find artifacts -maxdepth 1 -type f -name '*.tar.xz' | wc -l)"
          echo "release archive count for ${{ matrix.host_arch }}: $count"
          test "$count" -eq 6

      - name: Verify ${{ matrix.host_arch }} toolchains
        shell: bash
        run: |
          set -euo pipefail
          host_arch='${{ matrix.host_arch }}'
          for mode in elf glibc musl; do
            case "$mode" in
              elf)   triple=loongarch64-unknown-elf ;;
              glibc) triple=loongarch64-unknown-linux-gnu ;;
              musl)  triple=loongarch64-unknown-linux-musl ;;
            esac
            for compiler in gcc llvm; do
              base="loongarch64-${mode}-${host_arch}-host-glibc228"
              [[ "$mode" == glibc ]] && base+="-target-glibc236"
              [[ "$compiler" == llvm ]] && base+="-llvm"
              archive="artifacts/${base}-release.tar.xz"
              test -f "$archive"

              tmpdir="$(mktemp -d)"
              mkdir -p "$tmpdir/root"
              tar xJf "$archive" -C "$tmpdir/root"
              prefix="$(find "$tmpdir/root" -mindepth 1 -maxdepth 1 -type d -print -quit)"
              test -f "$prefix/LICENSE"
              test -f "$prefix/THIRD_PARTY_NOTICES.md"
              test -f "$prefix/VERSIONS.txt"
              printf 'int main(void) { return 0; }\n' > "$tmpdir/smoke.c"

              if [[ "$compiler" == llvm ]]; then
                cc="$prefix/bin/${triple}-clang"
                cxx="$prefix/bin/${triple}-clang++"
                test -x "$cc"
                test -x "$cxx"
                "$cc" --version >/dev/null
                "$cc" --target="$triple" -mabi=lp64d -c "$tmpdir/smoke.c" -o "$tmpdir/smoke.o"
              else
                cc="$prefix/bin/${triple}-gcc"
                test -x "$cc"
                "$cc" --version >/dev/null
                "$cc" -dumpmachine | grep -qx "$triple"
                "$cc" -c "$tmpdir/smoke.c" -o "$tmpdir/smoke.o"
              fi
              file "$tmpdir/smoke.o" | grep -qi loongarch
              echo "verified: ${base}-release.tar.xz"
              rm -rf "$tmpdir"
            done
          done

  publish:
    needs: [build, build-llvm, verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout license notices
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check release artifact count
        shell: bash
        run: |
          set -euo pipefail
          count="$(find artifacts -maxdepth 1 -type f -name '*.tar.xz' | wc -l)"
          echo "release archive count: $count"
          test "$count" -eq 12

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd artifacts
            LC_ALL=C sha256sum *.tar.xz > SHA256SUMS
          )
          test "$(wc -l < artifacts/SHA256SUMS)" -eq 12
          cat artifacts/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            LoongArch GCC and GCC+LLVM toolchains for `${{ github.ref_name }}`.

            This release contains twelve toolchain archives: x86_64 and
            aarch64 hosts, each with newlib, glibc, and musl targets, in a
            GCC-only variant and a GCC+LLVM variant.

            - Host glibc requirement: 2.28 or newer
            - Target: `loongarch64-lp64d`
            - glibc target runtime: glibc 2.36
            - GCC archives: binutils + GCC + target C library
            - LLVM archives: the matching GCC toolchain + clang/clang++/lld
              (plus LLVM runtimes for Linux and musl targets)
            - GDB, QEMU, and testsuite runs are not included
            - License and third-party notices are included in every archive
              and attached to this release
            - Source revisions are recorded in `VERSIONS.txt` in every archive
              and are fixed by the submodule gitlinks in this tagged commit
            - Verify downloads with `sha256sum -c SHA256SUMS`
          files: |
            LICENSE
            THIRD_PARTY_NOTICES.md
            artifacts/*.tar.xz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
