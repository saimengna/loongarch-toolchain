name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: release
      os: '["ubuntu-24.04","ubuntu-24.04-arm"]'
      mode: '["newlib","linux","musl"]'
      target: '["loongarch64-lp64d"]'
      compiler: '["gcc"]'
      strip: unstripped
      report: false
      gdb: false
      build-sim: false
      builder-image-repository: ghcr.io/${{ github.repository_owner }}/loongarch-builder
      builder-image-tag: glibc228
      host-glibc-max: "2.28"
      target-glibc-max: "2.36"

  # LLVM gets its own job budget and consumes the matching GCC archive from
  # the build job.  It does not rebuild GCC or any target C library.
  build-llvm:
    needs: [build]
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: release
      os: '["ubuntu-24.04","ubuntu-24.04-arm"]'
      mode: '["newlib","linux","musl"]'
      target: '["loongarch64-lp64d"]'
      compiler: '["llvm"]'
      strip: unstripped
      report: false
      gdb: false
      build-sim: false
      use-prebuilt-gnu: true
      builder-image-repository: ghcr.io/${{ github.repository_owner }}/loongarch-builder
      builder-image-tag: glibc228
      host-glibc-max: "2.28"
      target-glibc-max: "2.36"

  verify:
    needs: [build, build-llvm]
    uses: ./.github/workflows/verify-reusable.yaml
    with:
      artifact-name: release

  qemu-test:
    needs: [build, build-llvm]
    uses: ./.github/workflows/qemu-test-reusable.yaml
    with:
      artifact-name: release

  # Tier 2 runs against a separate host-built GCC compiler.  QEMU smoke above
  # still validates the exact release archives produced by build/build-llvm.
  regression-linux:
    needs: [build]
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: tier2-linux
      os: '["ubuntu-24.04"]'
      mode: '["linux"]'
      target: '["loongarch64-lp64d"]'
      compiler: '["gcc"]'
      strip: unstripped
      report: false
      gdb: false
      build-sim: true
      regression-suite: p0
      package-artifacts: false
      upload-artifacts: false
      builder-image-repository: ''
      host-glibc-max: "2.28"
      target-glibc-max: "2.36"

  regression-musl:
    needs: [build]
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: tier2-musl
      os: '["ubuntu-24.04"]'
      mode: '["musl"]'
      target: '["loongarch64-lp64d"]'
      compiler: '["gcc"]'
      strip: unstripped
      report: false
      gdb: false
      build-sim: true
      regression-suite: p0
      package-artifacts: false
      upload-artifacts: false
      builder-image-repository: ''
      host-glibc-max: "2.28"
      target-glibc-max: "2.36"

  publish:
    needs: [build, build-llvm, verify, qemu-test, regression-linux, regression-musl]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout license notices
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check release artifact count
        shell: bash
        run: |
          set -euo pipefail
          count="$(find artifacts -maxdepth 1 -type f -name '*.tar.xz' | wc -l)"
          echo "release archive count: $count"
          test "$count" -eq 12

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd artifacts
            LC_ALL=C sha256sum *.tar.xz > SHA256SUMS
          )
          test "$(wc -l < artifacts/SHA256SUMS)" -eq 12
          cat artifacts/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            LoongArch GCC and GCC+LLVM toolchains for `${{ github.ref_name }}`.

            This release contains twelve toolchain archives: x86_64 and
            aarch64 hosts, each with newlib, glibc, and musl targets, in a
            GCC-only variant and a GCC+LLVM variant.

            - Host glibc requirement: 2.28 or newer
            - Host runtime libraries MPFR/MPC/GMP are bundled under `lib/`;
              no `LD_LIBRARY_PATH` is required
            - Target: `loongarch64-lp64d`
            - glibc target runtime: glibc 2.36
            - GCC archives: binutils + GCC + target C library
            - LLVM archives: the matching GCC toolchain + clang/clang++/lld
              (plus LLVM runtimes for Linux and musl targets)
            - QEMU runtime smoke tests passed for glibc and musl; newlib
              packages received compile-only checks because they use a bare-metal
              runtime
            - GDB and the full GCC testsuite are not included
            - License and third-party notices are included in every archive
              and attached to this release
            - **Corresponding source**: upstream revisions are recorded in
              `VERSIONS.txt` and `SOURCE-OFFER.txt` in every archive. The build
              scripts are this repository at commit
              `${{ github.sha }}` (tag `${{ github.ref_name }}`):
              https://github.com/${{ github.repository }}/tree/${{ github.sha }}
              The source remains available for as long as these binaries are
              distributed.
            - Verify downloads with `sha256sum -c SHA256SUMS`
          files: |
            LICENSE
            LICENSE.LGPL-2.1
            LICENSE.GPL-2.0
            THIRD_PARTY_NOTICES.md
            artifacts/*.tar.xz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
