name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: release
      os: '["ubuntu-24.04","ubuntu-24.04-arm"]'
      mode: '["newlib","linux","musl"]'
      target: '["loongarch64-lp64d"]'
      compiler: '["gcc"]'
      strip: unstripped
      report: false
      gdb: false
      build-sim: false
      builder-image-repository: ghcr.io/${{ github.repository_owner }}/loongarch-builder
      builder-image-tag: glibc228
      host-glibc-max: "2.28"
      target-glibc-max: "2.36"
      fetch-locked: true

  verify:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host_arch: x86_64
          - runner: ubuntu-24.04-arm
            host_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download ${{ matrix.host_arch }} artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'loongarch64-*-${{ matrix.host_arch }}-host-glibc228*'
          path: artifacts
          merge-multiple: true

      - name: Check ${{ matrix.host_arch }} artifact count
        shell: bash
        run: |
          set -euo pipefail
          count="$(find artifacts -maxdepth 1 -type f -name '*.tar.xz' | wc -l)"
          echo "release archive count for ${{ matrix.host_arch }}: $count"
          test "$count" -eq 3

      - name: Verify ${{ matrix.host_arch }} toolchains
        shell: bash
        run: |
          set -euo pipefail
          host_arch='${{ matrix.host_arch }}'
          for mode in elf glibc musl; do
            archive="$(find artifacts -maxdepth 1 -type f \
              -name "loongarch64-${mode}-${host_arch}-host-glibc228*.tar.xz" \
              -print -quit)"
            test -n "$archive"
            base="$(basename "$archive")"
            case "$mode" in
              elf)   triple=loongarch64-unknown-elf ;;
              glibc) triple=loongarch64-unknown-linux-gnu ;;
              musl)  triple=loongarch64-unknown-linux-musl ;;
            esac

            tmpdir="$(mktemp -d)"
            mkdir -p "$tmpdir/root"
            tar xJf "$archive" -C "$tmpdir/root"
            prefix="$(find "$tmpdir/root" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            cc="$prefix/bin/${triple}-gcc"
            test -x "$cc"
            "$cc" --version >/dev/null
            "$cc" -dumpmachine | grep -qx "$triple"
            printf 'int main(void) { return 0; }\n' > "$tmpdir/smoke.c"
            "$cc" -c "$tmpdir/smoke.c" -o "$tmpdir/smoke.o"
            file "$tmpdir/smoke.o" | grep -qi loongarch
            echo "verified: $base"
            rm -rf "$tmpdir"
          done

  publish:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check release artifact count
        shell: bash
        run: |
          set -euo pipefail
          count="$(find artifacts -maxdepth 1 -type f -name '*.tar.xz' | wc -l)"
          echo "release archive count: $count"
          test "$count" -eq 6

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd artifacts
            LC_ALL=C sha256sum *.tar.xz > SHA256SUMS
          )
          test "$(wc -l < artifacts/SHA256SUMS)" -eq 6
          cat artifacts/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            LoongArch GCC toolchains for `${{ github.ref_name }}`.

            This release contains six GCC toolchain archives:
            x86_64 and aarch64 hosts, each with newlib, glibc, and musl
            targets.

            - Host glibc requirement: 2.28 or newer
            - Target: `loongarch64-lp64d`
            - glibc target runtime: glibc 2.36
            - Components: binutils + GCC + target C library
            - GDB, LLVM, QEMU, and testsuite runs are not included
            - Source revisions: locked by `sources.lock` at
              `${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/sources.lock`
            - Verify downloads with `sha256sum -c SHA256SUMS`
          files: |
            artifacts/*.tar.xz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
