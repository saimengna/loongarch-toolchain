name: Smoke GCC Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Smoke-test label; the final tag will be smoke-LABEL-RUN_NUMBER"
        required: true
        default: "gcc-c-newlib"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: smoke
      os: '["ubuntu-22.04"]'
      mode: '["newlib"]'
      target: '["loongarch64-lp64d"]'
      compiler: '["gcc"]'
      languages: '["c"]'
      strip: unstripped
      report: false
      gdb: false
      build-sim: false

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: find artifacts -maxdepth 2 -type f -print

      - name: Verify packaged compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          tar xJf artifacts/*.tar.xz -C verify
          prefix="$(find verify -mindepth 1 -maxdepth 1 -type d -print -quit)"
          cc="$prefix/bin/loongarch64-unknown-elf-gcc"
          "$cc" --version
          printf 'int smoke(void) { return 42; }\n' > /tmp/smoke.c
          "$cc" -c /tmp/smoke.c -o /tmp/smoke.o
          file /tmp/smoke.o | grep -i loongarch

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smoke-${{ inputs.version }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "LoongArch smoke GCC ${{ inputs.version }} #${{ github.run_number }}"
          body: |
            Small smoke-test GCC build for LoongArch.

            - Host: Ubuntu 22.04 (GitHub runner), x86_64
            - Host glibc requirement: 2.35+
            - Target: loongarch64-unknown-elf
            - Library: newlib
            - Components: binutils + GCC + newlib
            - Compiler languages: C only
            - GDB, LLVM, QEMU, and tests: not included
            - Source revision: `${{ github.sha }}`
          files: artifacts/*.tar.xz
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
