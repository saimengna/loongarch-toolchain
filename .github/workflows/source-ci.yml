name: Source CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'gcc'
      - 'binutils'
      - 'glibc'
      - 'newlib'
      - 'musl'
      - '.gitmodules'
      - 'Makefile.in'
      - 'scripts/fetch-sources.sh'
      - '.github/workflows/source-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'gcc'
      - 'binutils'
      - 'glibc'
      - 'newlib'
      - 'musl'
      - '.gitmodules'
      - 'Makefile.in'
      - 'scripts/fetch-sources.sh'
      - '.github/workflows/source-ci.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yaml
    with:
      artifact-name: ci
      os: '["ubuntu-24.04","ubuntu-24.04-arm"]'
      mode: '["newlib","linux","musl"]'
      target: '["loongarch64-lp64d"]'
      compiler: '["gcc"]'
      strip: unstripped
      report: false
      gdb: false
      build-sim: false
      builder-image-repository: ghcr.io/${{ github.repository_owner }}/loongarch-builder
      builder-image-tag: glibc228
      host-glibc-max: "2.28"
      target-glibc-max: "2.36"
      fetch-locked: false
