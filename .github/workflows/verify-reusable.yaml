name: Verify Reusable

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Artifact suffix: release or ci"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host_arch: x86_64
            image_arch: amd64
          - runner: ubuntu-24.04-arm
            host_arch: aarch64
            image_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/check-host-abi.sh
            scripts/check-in-glibc228.sh
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u '${{ github.actor }}' --password-stdin

      - name: Download ${{ matrix.host_arch }} artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'loongarch64-*-${{ matrix.host_arch }}-host-glibc228*-${{ inputs.artifact-name }}'
          path: artifacts
          merge-multiple: true

      - name: Check ${{ matrix.host_arch }} artifact count
        shell: bash
        run: |
          set -euo pipefail
          count="$(find artifacts -maxdepth 1 -type f -name '*.tar.xz' | wc -l)"
          echo "verify archive count for ${{ matrix.host_arch }}: $count"
          test "$count" -eq 6

      - name: Verify ${{ matrix.host_arch }} toolchains
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          host_arch='${{ matrix.host_arch }}'
          for mode in elf glibc musl; do
            case "$mode" in
              elf)   triple=loongarch64-unknown-elf ;;
              glibc) triple=loongarch64-unknown-linux-gnu ;;
              musl)  triple=loongarch64-unknown-linux-musl ;;
            esac
            for compiler in gcc llvm; do
              base="loongarch64-${mode}-${host_arch}-host-glibc228"
              [[ "$mode" == glibc ]] && base+="-target-glibc236"
              [[ "$compiler" == llvm ]] && base+="-llvm"
              archive="artifacts/${base}-${ARTIFACT_NAME}.tar.xz"
              test -f "$archive"

              tmpdir="$(mktemp -d)"
              mkdir -p "$tmpdir/root"
              tar xJf "$archive" -C "$tmpdir/root"
              prefix="$(find "$tmpdir/root" -mindepth 1 -maxdepth 1 -type d -print -quit)"
              test -f "$prefix/LICENSE"
              test -f "$prefix/LICENSE.LGPL-2.1"
              test -f "$prefix/LICENSE.GPL-2.0"
              test -f "$prefix/THIRD_PARTY_NOTICES.md"
              test -f "$prefix/VERSIONS.txt"
              test -f "$prefix/SOURCE-OFFER.txt"
              awk -v s="$GITHUB_SHA" '$1 == "toolchain" && $2 == s { found = 1 } END { exit !found }' "$prefix/VERSIONS.txt"
              grep -q 'Corresponding Source' "$prefix/SOURCE-OFFER.txt"
              grep -q "$GITHUB_SHA" "$prefix/SOURCE-OFFER.txt"
              grep -Eq '^  gcc +[0-9a-f]{40}$' "$prefix/SOURCE-OFFER.txt"
              grep -Eq '^  binutils +[0-9a-f]{40}$' "$prefix/SOURCE-OFFER.txt"
              if grep -q 'unknown' "$prefix/SOURCE-OFFER.txt"; then
                echo "SOURCE-OFFER.txt contains unknown revisions" >&2
                exit 1
              fi
              case "$mode" in
                glibc) grep -Eq '^  glibc +[0-9a-f]{40}$' "$prefix/SOURCE-OFFER.txt" ;;
                musl)  grep -Eq '^  musl +[0-9a-f]{40}$' "$prefix/SOURCE-OFFER.txt" ;;
                elf)   grep -Eq '^  newlib +[0-9a-f]{40}$' "$prefix/SOURCE-OFFER.txt" ;;
              esac
              for lib in libmpfr.so.4 libmpc.so.3 libgmp.so.10; do
                test -e "$prefix/lib/${lib}" || { echo "missing bundled $lib" >&2; exit 1; }
              done
              bash scripts/check-host-abi.sh \
                --prefix "$prefix" \
                --glibc-max 2.28 \
                --glibcxx-max 3.4.25 \
                --cxxabi-max 1.3.11
              image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loongarch-builder:glibc228-${{ matrix.image_arch }}"
              bash scripts/check-in-glibc228.sh \
                --prefix "$prefix" \
                --triple "$triple" \
                --compiler "$compiler" \
                --image "$image"
              printf 'int main(void) { return 0; }\n' > "$tmpdir/smoke.c"
              printf 'int smoke_cpp(void) { return 0; }\n' > "$tmpdir/smoke.cpp"

              if [[ "$compiler" == llvm ]]; then
                cc="$prefix/bin/${triple}-clang"
                cxx="$prefix/bin/${triple}-clang++"
                test -x "$cc"
                test -x "$cxx"
                env -u LD_LIBRARY_PATH "$cc" --version >/dev/null
                env -u LD_LIBRARY_PATH "$cc" --target="$triple" -mabi=lp64d -c "$tmpdir/smoke.c" -o "$tmpdir/smoke.o"
                env -u LD_LIBRARY_PATH "$cxx" --target="$triple" -mabi=lp64d -c "$tmpdir/smoke.cpp" -o "$tmpdir/smoke-cpp.o"
              else
                cc="$prefix/bin/${triple}-gcc"
                cxx="$prefix/bin/${triple}-g++"
                test -x "$cc"
                env -u LD_LIBRARY_PATH "$cc" --version >/dev/null
                env -u LD_LIBRARY_PATH "$cc" -dumpmachine | grep -qx "$triple"
                env -u LD_LIBRARY_PATH "$cc" -c "$tmpdir/smoke.c" -o "$tmpdir/smoke.o"
                if [[ -x "$cxx" ]]; then
                  env -u LD_LIBRARY_PATH "$cxx" -c "$tmpdir/smoke.cpp" -o "$tmpdir/smoke-cpp.o"
                fi

                for program in cc1 cc1plus lto1; do
                  path="$(env -u LD_LIBRARY_PATH "$cc" -print-prog-name="$program" 2>/dev/null || true)"
                  [[ -f "$path" ]] || continue
                  if env -u LD_LIBRARY_PATH ldd "$path" 2>&1 | grep -q 'not found'; then
                    echo "missing runtime library for $path" >&2
                    env -u LD_LIBRARY_PATH ldd "$path" >&2
                    exit 1
                  fi
                done
              fi
              if ! readelf -d "$cc" | grep -Fq '$ORIGIN'; then
                echo "missing relative RPATH in $cc" >&2
                exit 1
              fi
              file "$tmpdir/smoke.o" | grep -qi loongarch
              echo "verified: ${base}-${ARTIFACT_NAME}.tar.xz"
              rm -rf "$tmpdir"
            done
          done
